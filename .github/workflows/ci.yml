name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Atoms installs from git and builds on install, so scripts must run.
      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run coverage
      - run: npm run build
      - run: npm run lint:package

      - name: Build the demo
        run: npm run playground:build
        env:
          PAGES: '1'
          PAGES_BASE: /agentic-chat-ui/
